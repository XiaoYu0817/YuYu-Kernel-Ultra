name: Build YuYu Kernel Ultra (Alpha)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > yuyu-release.jks
            echo "KEYSTORE_BASE64 restored"
          else
            echo "No KEYSTORE_BASE64 secret provided, building unsigned"
          fi

      - name: Write signing config
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f yuyu-release.jks ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            cat > config.prop << EOC
          keyStore=yuyu-release.jks
          keyStorePass=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPass=$KEY_PASSWORD
          EOC
            echo "signing config written"
          else
            echo "Skipping signing config (some secrets missing)"
          fi

      - name: Fix executable permissions
        run: chmod +x build.py app/gradlew

      - name: Restore missing git submodules
        run: |
          set -e
          ext="native/src/external"
          fetch_sub() {
            local name="$1" url="$2" sha="$3"
            local dir="$ext/$name"
            rm -rf "$dir"
            mkdir -p "$dir"
            curl -fsSL "${url}/archive/${sha}.tar.gz" -o /tmp/sub.tar.gz
            tar -xzf /tmp/sub.tar.gz -C "$dir" --strip-components=1
            rm -f /tmp/sub.tar.gz
            echo "restored $name @ ${sha:0:7}"
          }
          fetch_sub crt0              https://github.com/topjohnwu/crt0              9dfa67b4d543f1b6bf2e936f560fbe77ca2a226a
          fetch_sub cxx-rs            https://github.com/topjohnwu/cxx                b09b91554b392523f633b9e3cbe0b43273528c71
          fetch_sub libcxx            https://github.com/topjohnwu/libcxx             d5117df3ba7704aab06c3a30b97c7529c931662b
          fetch_sub lsplt             https://github.com/LSPosed/LSPlt               cef80a97a73184b4def9b3e1148884365fc173fd
          fetch_sub lz4               https://github.com/lz4/lz4                    d44371841a2f1728a3f36839fd4b7e872d0927d3
          fetch_sub selinux           https://github.com/topjohnwu/selinux           be1b39a657fee7faacfae548b75cb53302043a01
          fetch_sub system_properties https://github.com/topjohnwu/system_properties b7c2088565fbe13d22fe074960332e89615bb4aa

          mkdir -p native/out/generated/rust
          cp native/src/external/cxx-rs/include/cxx.h native/out/generated/rust/cxx.h
          echo "staged rust/cxx.h into include path"

      - name: Build release
        run: ./build.py -vr all

      - name: Stop gradle daemon
        run: ./app/gradlew --stop

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: yuyu-kernel-ultra-${{ github.sha }}
          path: out
          compression-level: 9
